openapi: 3.0.1
info:
  title: auth-manager-bff
  description: Backend-For-Frontend service for the auth-ui. Provides capabilities discovery and proxies traffic to auth-manager and OPA servers.
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
paths:
  /capabilities:
    get:
      operationId: getCapabilities
      tags:
        - Capabilities
      summary: Returns the current BFF capabilities so the UI can adapt its interface
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capabilities'
security:
  - {}
components:
  schemas:
    error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    capabilities:
      type: object
      required:
        - site
        - environments
        - features
      properties:
        site:
          type: string
          description: The identifier of the current deployment site
          example: israel-dc-1
        environments:
          type: array
          description: List of OPA environment names available on this node
          items:
            type: string
          example: ['np', 'stage', 'prod']
        features:
          type: object
          required:
            - managerEnabled
            - opaEnabled
          properties:
            managerEnabled:
              type: boolean
              description: Whether the auth-manager proxy is enabled on this node
              example: true
            opaEnabled:
              type: boolean
              description: Whether the OPA proxy is enabled on this node
              example: true
